services:
  shop:
    build: .
    environment:
      NODE_ENV: production
      XSS_PREVIEW_ORIGIN: ${XSS_PREVIEW_ORIGIN:-http://127.0.0.1:8081}
      INTERNAL_HTTP_TEST: "true"
      ENABLE_DEMO_ACCOUNTS: "true"
      AUDIT_LOG_PATH: /tmp/dice-lore-audit/app.log
    ports:
      - "${SHOP_BIND_IP:-127.0.0.1}:8080:3001"
    volumes:
      - shop-data:/data
    tmpfs:
      - /tmp/dice-lore-audit:size=32m,mode=1777
    restart: unless-stopped

  xss-preview:
    build: ./challenge-xss
    environment:
      XSS_SHOP_ORIGINS: ${XSS_SHOP_ORIGINS:-http://localhost:8080 http://localhost:5173 http://localhost:3001}
    ports:
      - "${XSS_BIND_IP:-127.0.0.1}:8081:8081"
    networks:
      - xss-isolated
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped

networks:
  xss-isolated:
    # Dedicated bridge; publish the preview without granting normal NAT egress.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  shop-data: